<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王义凯 - 个人主页</title>
    <style>
        :root {
            --bg-start: #0b1e3f;
            --bg-mid1: #14336b;
            --bg-mid2: #1f4e94;
            --bg-end: #3570b5;
            --card-bg: rgba(255, 255, 255, 0.07);
            --text-primary: #ffffff;
            --text-secondary: #cfe0f5;
            --text-muted: #a5c0e0;
            --accent: #64b5f6;
            --accent-hover: #42a5f5;
            --button-border: rgba(100, 180, 246, 0.5);
            --button-glow: rgba(100, 180, 246, 0.35);
            --divider: rgba(255, 255, 255, 0.15);
            --tag-bg: rgba(255, 255, 255, 0.1);
            --tag-border: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            background: linear-gradient(155deg, #0b1e3f 0%, #14336b 20%, #1f4e94 50%, #3570b5 80%, #4a8bcf 100%);
            background-attachment: fixed;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* 装饰光晕 */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -10%;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, rgba(100, 180, 246, 0.16) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatOrb1 14s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(70, 150, 220, 0.13) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatOrb2 18s ease-in-out infinite;
        }

        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -40px) scale(1.12); }
            66% { transform: translate(-30px, 30px) scale(0.92); }
        }

        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-40px, -30px) scale(1.08); }
            66% { transform: translate(30px, 40px) scale(0.9); }
        }

        /* 主卡片 */
        .card {
            position: relative;
            z-index: 1;
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            padding: 56px 48px 52px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.06) inset;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 72px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
        }

        /* 头像 */
        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 28px;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #64b5f6 0%, #3b8fd9 60%, #1a5fa8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            box-shadow: 0 10px 30px rgba(30, 80, 160, 0.45), 0 0 0 4px rgba(255, 255, 255, 0.12);
            user-select: none;
            transition: box-shadow 0.4s ease;
        }

        .card:hover .avatar {
            box-shadow: 0 14px 38px rgba(30, 80, 160, 0.6), 0 0 0 5px rgba(255, 255, 255, 0.18);
        }

        /* 标题 */
        .name {
            font-size: 2.9rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            line-height: 1.2;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            font-weight: 500;
            color: #a0c4e8;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 22px;
        }

        /* 分割线 */
        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 0 auto 26px;
            border-radius: 2px;
            opacity: 0.8;
        }

        /* 自我介绍 */
        .bio {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #d6e3f0;
            margin-bottom: 36px;
            padding: 0 10px;
            letter-spacing: 0.02em;
        }

        .bio strong {
            color: #ffffff;
            font-weight: 600;
        }

        /* 标签 */
        .tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 36px;
        }

        .tag {
            background: var(--tag-bg);
            border: 1px solid var(--tag-border);
            border-radius: 20px;
            padding: 7px 18px;
            font-size: 0.88rem;
            color: #cfe0f5;
            letter-spacing: 0.03em;
            transition: all 0.3s ease;
            cursor: default;
            user-select: none;
        }

        .tag:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        /* 联系按钮 */
        .contact-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(100, 180, 246, 0.2);
            border: 1.5px solid var(--button-border);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            padding: 14px 36px;
            border-radius: 50px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25), 0 0 0 0 var(--button-glow);
        }

        .contact-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.12),
                    transparent);
            transition: left 0.55s ease;
        }

        .contact-btn:hover {
            background: rgba(100, 180, 246, 0.32);
            border-color: rgba(100, 180, 246, 0.75);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), 0 0 28px var(--button-glow);
            transform: translateY(-3px);
            color: #ffffff;
        }

        .contact-btn:hover::after {
            left: 100%;
        }

        .contact-btn:active {
            transform: translateY(-1px) scale(0.97);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3), 0 0 16px var(--button-glow);
            transition: all 0.1s ease;
        }

        .btn-icon {
            display: inline-block;
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .contact-btn:hover .btn-icon {
            transform: translateX(3px);
        }

        /* 社交链接 */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 28px;
        }

        .social-link {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #bcd4f0;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.35);
            color: #ffffff;
            transform: translateY(-3px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .card {
                padding: 40px 24px 36px;
                border-radius: 22px;
            }
            .name {
                font-size: 2.3rem;
            }
            .bio {
                font-size: 0.98rem;
                padding: 0;
            }
            .contact-btn {
                padding: 13px 30px;
                font-size: 0.98rem;
            }
            .avatar {
                width: 78px;
                height: 78px;
                font-size: 34px;
            }
            .tags {
                gap: 8px;
            }
            .tag {
                padding: 6px 14px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 头像 -->
        <div class="avatar-wrapper">
            <div class="avatar">王</div>
        </div>

        <!-- 大标题 -->
        <h1 class="name">王义凯</h1>
        <p class="subtitle">高中生 · 编程爱好者 · AI 探索者 · 33班</p>

        <!-- 分割线 -->
        <div class="divider"></div>

            希望未来能创造出有温度、有智慧的 AI 作品。期待与你交流学习，共同进步！
        </p>

        <!-- 技能/兴趣标签 -->
        <div class="tags">
            <span class="tag">Python</span>

            <span class="tag">算法探索</span>

        <!-- 联系我按钮 -->
        <a href="mailto:3515461508@qq.com" class="contact-btn" title="发送邮件给王义凯">
            <span>联系我</span>
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">

                <polyline points="12 5 19 12 12 19"></polyline>

</body>
</html>
